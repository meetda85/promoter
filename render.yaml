# Despliegue en Render (https://render.com) con un clic:
# New → Blueprint → elige este repositorio. Render lee este archivo y ya está.
services:
  - type: web
    name: promoter
    runtime: node
    plan: free
    # Sin `region`: Render usa la suya por defecto. Para acercarla a donde
    # ruedas, añade aquí `region: oregon` (América) o `region: frankfurt`
    # (Europa).
    buildCommand: npm install && npm run build
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
